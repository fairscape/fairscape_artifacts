[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairscape-artifacts"
version = "0.2.0"
description = "Generate datasheets, evidence graphs and AI-Ready reviews from a local RO-Crate"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    # The only hard dependency. The evidence graph engine, the crate reader
    # and the input/output derivation are standard library only, and the
    # React Flow viewer is a checked-in build (see static/PROVENANCE.md), so
    # installing this does not need a node toolchain.
    "jinja2>=3.0",
]

[project.optional-dependencies]
# AI-Ready review. Scoring is not reimplemented here: the rubric lives in
# `aireadiness_evidence`, shipped by the AIreadiness-grader repo. Without it
# every other command still works and the datasheet omits its review section.
review = ["aireadiness-grader>=0.4.0"]
# LLM interpretation. The engine — condensation, annotation, synthesis and
# the AnnotatedEvidenceGraph model — is `fairscape-graph-tools`, which brings
# pydantic-ai and the provider SDKs. Without it `interpret` explains what to
# install and everything else is unaffected.
interpret = ["fairscape-graph-tools>=0.2.0"]
test = ["pytest>=7"]

[project.scripts]
fairscape-artifacts = "fairscape_artifacts.cli:main"

[tool.hatch.build.targets.wheel]
# `packages` already ships every file under the package, static/ and
# templates/ included; force-including them again makes hatchling abort with
# "A second file is being added to the wheel archive at the same path".
packages = ["fairscape_artifacts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
